# Publishes a release when a tag v<version> is pushed (docs/maintainers/ci-and-release.md):
#   1. verify: the tag is on main and names the version of Directory.Build.props.
#   2. ci.yml and unity.yml on the tagged commit. ci.yml builds the NuGet packages that are published, and its tests
#      check the rest of the release pull request (PackageVersionTests: the UPM packages, the documentation and the
#      newest section of CHANGELOG.md carry the version), which has already passed them before the tag.
#   3. publish, after a maintainer approves the release environment: the packages to nuget.org (trusted publishing, no
#      stored API key) and a GitHub release with the version's section of CHANGELOG.md.
#   4. docs.yml publishes the site for this version.
# OpenUPM builds the UPM packages from the tag on its own; it does not wait for this workflow. A rerun uses the workflow
# of the tagged commit: a failure from a setting is fixed by a rerun, one from this file only by the next version.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # main, for the check that the tag is on it
          persist-credentials: false
      - name: The tag is on main and names the library version
        run: |
          version="${GITHUB_REF_NAME#v}"
          failed=0
          fail() { echo "::error::$1"; failed=1; }
          git merge-base --is-ancestor HEAD origin/main || fail "$GITHUB_REF_NAME is not on main: tag a commit of main."
          grep -qF "<Version>$version</Version>" Directory.Build.props || fail "The <Version> of Directory.Build.props is not $version."
          exit "$failed"

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  unity:
    needs: verify
    uses: ./.github/workflows/unity.yml
    secrets: inherit

  publish:
    needs: [ci, unity]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Waits for a maintainer's approval. nuget.org's trusted publishing policy accepts tokens from this environment only.
    environment: release
    permissions:
      contents: write  # the GitHub release
      id-token: write  # the OIDC token that NuGet/login exchanges for a short-lived API key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: packages
          path: packages
      - id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      # Each .snupkg next to its .nupkg goes with it. --skip-duplicate: a rerun after a partial push pushes the rest.
      - name: Push the packages to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version] - " 'index($0, heading) == 1 { found = 1; next } found && /^## \[/ { exit } found' CHANGELOG.md > notes.md
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "FlowTask $version" --notes-file notes.md "${prerelease[@]}"

  docs:
    needs: publish
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
